{% extends "base.html" %}

{% block conteudo %}
        <section class="section">
            <h2><i class="fa-solid fa-book-open"></i> Cadastrar Novo Assunto</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}
                    <div class="painel-estudos">
                        <p><i class="fa-solid fa-info-circle"></i> {{ msg }}</p>
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <hr>

            <form method="POST" enctype="multipart/form-data" class="form">
                <label>Nome do Assunto:</label>
                <input type="text" name="nome" placeholder="Ex: Sujeito e Predicado" required>

                <label>Conteúdo / Explicação:</label>
                <textarea name="conteudo" rows="5" placeholder="Escreva aqui o conteúdo do assunto..." required></textarea>

                <label>Arquivo PDF (opcional):</label>
                <input type="file" name="arquivo_pdf" accept=".pdf">

                <label>Imagem Ilustrativa (opcional):</label>
                <input type="file" name="imagem" accept="image/png, image/jpeg, image/jpg">

                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <button type="submit" class="btn btn-salvar">
                        <i class="fa-solid fa-save"></i> Cadastrar Assunto
                    </button>
                    <a href="{{ url_for('listar_assuntos') }}" class="btn btn-gramatica">
                        <i class="fa-solid fa-arrow-left"></i> Voltar
                    </a>
                </div>
            </form>
        </section>
{% endblock %}
