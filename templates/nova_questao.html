{% extends "base.html" %}

{% block conteudo %}

        <section class="section">
            <h2><i class="fa-solid fa-list-check"></i> Cadastrar Nova Questão</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}
                    <div class="painel-estudos" style="background: var(--soft-yellow);">
                        <p style="text-align: center;"><i class="fa-solid fa-info-circle"></i> {{ msg }}</p>
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <hr style="border: 1px solid var(--gray-light); margin: 25px 0;">
            <form method="POST" class="form" style="max-width: 100%; margin: 20px 0;">
                <label style="font-weight: 600;">Atividade:</label>
                <select name="atividade_id" required style="padding: 12px; border-radius: 10px; border: 2px solid var(--gray-light); width: 100%;">
                    <option value="">Selecione uma atividade</option>
                    {% for atividade in atividades %}
                    <option value="{{ atividade.id }}">{{ atividade.nome }} ({{ atividade.assunto.nome }})</option>
                    {% endfor %}
                </select>

                <label style="font-weight: 600;">Enunciado:</label>
                <textarea name="enunciado" required rows="3" style="padding: 12px; border-radius: 10px; border: 2px solid var(--gray-light); width: 100%;"></textarea>

                <label style="font-weight: 600;">Alternativa A:</label>
                <input type="text" name="alternativa_a" required style="width: 100%;">

                <label style="font-weight: 600;">Alternativa B:</label>
                <input type="text" name="alternativa_b" required style="width: 100%;">

                <label style="font-weight: 600;">Alternativa C:</label>
                <input type="text" name="alternativa_c" required style="width: 100%;">

                <label style="font-weight: 600;">Alternativa D:</label>
                <input type="text" name="alternativa_d" required style="width: 100%;">

                <label style="font-weight: 600;">Alternativa E:</label>
                <input type="text" name="alternativa_e" required style="width: 100%;">

                <label style="font-weight: 600;">Resposta Correta:</label>
                <select name="resposta_correta" required style="padding: 12px; border-radius: 10px; border: 2px solid var(--gray-light); width: 100%;">
                    <option value="">Selecione</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="E">E</option>
                </select>

                <button type="submit" class="botao" style="align-self: flex-start;">
                    <i class="fa-solid fa-save"></i> Cadastrar Questão
                </button>
            </form>
{% endblock %}
