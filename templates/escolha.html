{% extends "base.html" %}

{% block conteudo %}
        <section id="escolha" class="section">
            <h2>Como você quer iniciar?</h2>
            <p>Clique em uma das opções abaixo para começar a estudar agora mesmo:</p>
            
            <div class="opcoes-inicio">
                <a href="{{ url_for('gramatica') }}" class="btn btn-gramatica"><i class="fa-solid fa-book"></i> Gramática</a>
                <a href="{{ url_for('atividades') }}" class="btn btn-atividades"><i class="fa-solid fa-pen"></i> Atividades</a>
            </div>
            
            <div class="imagem-escolha-container">
                <img src="{{ url_for('static', filename='img/1000146675.png') }}" alt="Ilustração de um mascote animado pronto para começar" class="imagem-escolha">
            </div>

            <div class="mensagem-fixa">
                <p>Como você prefere começar a sua jornada de estudos? </p>
            </div>
            </section>
{% endblock %}
