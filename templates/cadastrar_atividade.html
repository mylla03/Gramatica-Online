{% extends "base.html" %}

{% block conteudo %}

        <section class="section">
            <h2><i class="fa-solid fa-plus-circle"></i> Cadastrar Nova Atividade</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for msg in messages %}
                    <div class="painel-estudos">
                        <p><i class="fa-solid fa-info-circle"></i> {{ msg }}</p>
                    </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <hr>

            <form method="POST" class="form">
                <label>Nome da Atividade:</label>
                <input type="text" name="nome" placeholder="Ex: Exercícios de Sujeito" required>

                <label>Nível de Dificuldade:</label>
                <select name="dificuldade" required>
                    <option value="Fácil">Fácil</option>
                    <option value="Médio">Médio</option>
                    <option value="Difícil">Difícil</option>
                </select>

                <label>Assunto Relacionado:</label>
                <select name="assunto_id" required>
                    <option value="">Selecione um assunto</option>
                    {% for assunto in assuntos %}
                    <option value="{{ assunto.id }}">{{ assunto.nome }}</option>
                    {% endfor %}
                </select>

                <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                    <button type="submit" class="botao">
                        <i class="fa-solid fa-save"></i> Cadastrar
                    </button>
                    <a href="{{ url_for('listar_atividades') }}" class="btn btn-gramatica">
                        <i class="fa-solid fa-arrow-left"></i> Voltar
                    </a>
                </div>
            </form>
        </section>
{% endblock %}
